regions:
  - global
  - us-east-1
#  - us-east-2
#  - us-west-1
#  - us-west-2

account-blocklist:
  - "999999999999" # production

resource-types:
  excludes:
    # these fail...
    - OSPackage
    # Terraform (infra-testing-sandbox) owns the account password policy
    # (create_account_password_policy = true). Without this exclude the nightly
    # nuke deletes it, so every `terraform plan` shows a perpetual recreate.
    - IAMAccountSettingPasswordPolicy

# cat out.nuke.txt | grep "would remove" | grep "sndbx" | sed -r 's/^(global|us-east-1) - ([A-Za-z0-9]*) - ([A-Za-z0-9\\\/\.:-]*( -\> [A-Za-z0-9:\\\/\.:-]*)?).*/\2:\n  - "\3"/'
accounts:
  "234656776442":
    filters:
      DynamoDBTable:
        # Cross-repo sandbox lock (infra-testing-sandbox). Terratest and this nuke
        # coordinate through it; deleting it makes every lane fail LOCK UNREADABLE.
        - "brd-sndbx-ue1-core-sandbox-lock"
      DynamoDBTableItem:
        # The live lock item. The nuke holds this lock while it runs.
        - "brd-sndbx-ue1-core-sandbox-lock -> sandbox"
      ElasticacheUser:
        # AWS-managed default (Valkey IAM auth), provisioned by AWS around
        # 2026-09-29. The API rejects DeleteUser for this id (a dot is not a
        # legal customer user id), so without this filter every run ends
        # fatal. Upstream: https://github.com/ekristen/aws-nuke/issues/1039
        # Remove both filters once the pinned aws-nuke includes the #1039 fix.
        - "default.iam-user"
      ElasticacheUserGroup:
        # Same AWS-managed default; DeleteUserGroup is rejected the same way.
        - "default.iam-user-group"
      IAMGroup:
        - "brd-sndbx-ue1-core-admins"
      IAMGroupPolicyAttachment:
        - "brd-sndbx-ue1-core-admins -> AdministratorAccess"
      IAMOpenIDConnectProvider:
        - "arn:aws:iam::234656776442:oidc-provider/token.actions.githubusercontent.com"
      IAMUserGroupAttachment:
        - "brd-sndbx-ue1-core-bendoerr -> brd-sndbx-ue1-core-admins"
      IAMLoginProfile:
        - "brd-sndbx-ue1-core-bendoerr"
      IAMUser:
        - "brd-sndbx-ue1-core-apply"
        - "brd-sndbx-ue1-core-bendoerr"
      IAMUserAccessKey:
        - "brd-sndbx-ue1-core-apply -> __KEY_ID_APPLY__"
        - "brd-sndbx-ue1-core-bendoerr -> __KEY_ID_BENDOERR__"
      IAMPolicy:
        # Instance-profile grant for terratest (fod efs-access); Ben-authorized
        # 2026-08-20. Delete this line + the attachment line below when the
        # actions are folded into brd-sndbx-ue1-core-apply-2.
        - "arn:aws:iam::234656776442:policy/oldmanbendobot/brd-sndbx-ue1-core-apply-instance-profiles"
        - "arn:aws:iam::234656776442:policy/brd-sndbx-ue1-core-apply-1"
        - "arn:aws:iam::234656776442:policy/brd-sndbx-ue1-core-apply-2"
        - "arn:aws:iam::234656776442:policy/brd-sndbx-ue1-core-apply-3"
        - "arn:aws:iam::234656776442:policy/brd-sndbx-ue1-core-sandbox-lock"
      IAMRole:
        - "OrganizationAccountAccessRole"
        - "brd-sndbx-ue1-core-admins"
        - "brd-sndbx-ue1-core-apply"
      IAMRolePolicyAttachment:
        - "OrganizationAccountAccessRole -> AdministratorAccess"
        - "brd-sndbx-ue1-core-admins -> AdministratorAccess"
        - "brd-sndbx-ue1-core-apply -> brd-sndbx-ue1-core-apply-1"
        - "brd-sndbx-ue1-core-apply -> brd-sndbx-ue1-core-apply-2"
        - "brd-sndbx-ue1-core-apply -> brd-sndbx-ue1-core-apply-3"
        - "brd-sndbx-ue1-core-apply -> brd-sndbx-ue1-core-apply-instance-profiles"
        - "brd-sndbx-ue1-core-apply -> brd-sndbx-ue1-core-sandbox-lock"
      IAMVirtualMFADevice:
        - "arn:aws:iam::234656776442:mfa/1Password"
