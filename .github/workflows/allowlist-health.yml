name: "Allowlist health"

# Does every host in aws-nuke.yml's harden-runner allowlist still resolve?
#
# WHY THIS IS A SCHEDULED JOB AND NOT ONLY A PR CHECK: the failure it detects is an AWS
# SERVICE RETIREMENT, which happens on Amazon's calendar and not on ours. A PR-only check
# would go green forever while the allowlist rotted underneath it -- exactly how three dead
# names accumulated unnoticed. The schedule is the whole point; the PR trigger is a bonus.
#
# The scheduled run is deliberately visible to `ops/scheduled-health.sh`, which reads the
# latest SCHEDULED run of every workflow in the org. That is the reader: a guard nobody
# runs is not a guard, so this rides a surface that already fires twice a day.

on:
  schedule:
    # Mondays 07:30 UTC. The slot is arbitrary and nothing depends on it.
    # An earlier version of this comment claimed the time was "offset well away from
    # aws-nuke's own ticks so a slow DNS sweep cannot collide" -- that reasoning is wrong and
    # was deleted rather than reworded. GitHub's scheduler has no contractual shape: measured
    # over 843 intervals of aws-nuke's own nominally-6h cron, gaps ran 2.34h to 15.99h. You
    # cannot offset away from a tick whose position you cannot predict.
    # Collision is a non-issue here for a REAL reason instead: this job only performs DNS
    # lookups. It creates, modifies and deletes nothing, so it cannot collide with anything.
    - cron: "30 7 * * 1"
  pull_request:
    paths:
      - ".github/workflows/aws-nuke.yml"
      - ".github/scripts/check-allowlist-resolves.sh"
      - ".github/workflows/allowlist-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allowlist-resolves:
    runs-on: ubuntu-latest
    # ~160 lookups with up to 3 attempts and a 1s backoff each. A resolver that hangs rather
    # than refusing would otherwise sit here burning a runner until the 6h default; this job
    # has no reason to outlive a few minutes.
    timeout-minutes: 15
    steps:
      # egress-policy: audit, NOT block, and the reason is not laziness.
      # This job's entire purpose is to perform DNS lookups against ~160 AWS endpoints.
      # Running it behind a block policy would mean maintaining a SECOND allowlist that can
      # rot in exactly the way this job exists to detect -- a guard whose own guard is the
      # bug it hunts. Audit still records egress for review without gating the lookups.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every allowlisted host still resolves
        run: ./.github/scripts/check-allowlist-resolves.sh .github/workflows/aws-nuke.yml
