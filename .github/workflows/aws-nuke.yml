      # Ensure that an account alias is set or aws-nuke fails.
      # Use the canonical alias (module.label.id in infra-testing-sandbox) so the
      # nightly run stops drifting it away from the Terraform-declared value.
      - run: aws iam create-account-alias --account-alias brd-sndbx-ue1-core-testing || true

      # Inject secret key IDs into config before running aws-nuke
