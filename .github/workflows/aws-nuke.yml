name: AWS Nuke

on:
  # Enable manual runs
  workflow_dispatch:
    inputs:
      delete:
        description: 'Set to "true" to actually delete stuff'
        required: true
        default: "false"

  # Enable pull request for testing
  pull_request:
    types: [opened, synchronize, reopened]

  # Nuke testing account on a schedule
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: sandbox-test
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    # Skip on Dependabot PRs: GitHub does not expose the SANDBOX_NUKE_KEY_ID_* secrets to
    # dependabot-author PRs, so the "Prepare config" guard fails every time. Dependabot only
    # bumps action/dep versions and never touches sandbox-nuke.yml, so there is nothing for
    # the dry-run to validate on those PRs. (dry-run is not a required status check.)
    if: |
      ( github.event_name == 'pull_request' || ( github.event_name == 'workflow_dispatch' && github.event.inputs.delete != 'true' ) )
      && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
    steps:
